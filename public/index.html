<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEase — Everyday Essentials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="/">Shop<span>Ease</span></a>
      <form class="search" id="searchForm">
        <input id="searchInput" placeholder="Search groceries, household, kids playsets…" aria-label="Search products">
        <button aria-label="Search">🔍</button>
      </form>
      <div class="user-box">
        <label for="userSelect">Signed in as</label>
        <select id="userSelect"></select>
      </div>
      <a class="nav-link hidden" id="consoleLink" href="/admin.html">🛡️ Audit Console</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Fresh deals on everyday essentials</h1>
        <p>Groceries, household supplies and kids playsets — with price history so you always buy at the right time.</p>
      </div>
      <button id="heroAsk">💬 Ask Ema, your shopping assistant</button>
    </section>

    <div class="chips" id="categoryChips">
      <button class="chip active" data-cat="">All</button>
      <button class="chip" data-cat="Household">🧽 Household</button>
      <button class="chip" data-cat="Grocery">🥦 Grocery</button>
      <button class="chip" data-cat="Kids Playsets">🧸 Kids Playsets</button>
    </div>
    <div class="grid" id="productGrid"></div>
  </main>

  <!-- Chat widget -->
  <button class="fab" id="fab" aria-label="Open shopping assistant">💬<span class="dot"></span></button>
  <section class="chat hidden" id="chat" aria-label="Shopping assistant">
    <div class="chat-header">
      <div class="avatar">🛍️</div>
      <div>
        <div class="title">Ema · ShopEase Assistant</div>
        <div class="sub" id="chatSub">Online</div>
      </div>
      <button class="close" id="chatClose" aria-label="Close">×</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="suggestions" id="suggestions"></div>
    <form class="composer" id="composer">
      <input id="chatInput" autocomplete="off" placeholder="Ask about orders, prices, recommendations…" maxlength="1000">
      <button type="submit">Send</button>
    </form>
  </section>

  <script src="common.js"></script>
  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
