<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .x{font-size:11px;fill:#64748b}
      .h{font-size:13px;font-weight:800;letter-spacing:1px;fill:#475569;stroke:#fff;stroke-width:7px;paint-order:stroke;stroke-linejoin:round}
      .box{rx:10;stroke-width:1.5}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .au{stroke:#b45309;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#r)}
    </style>
  </defs>
  <rect width="1280" height="860" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="800" fill="#0f766e">ShopEase Shopping Assistant — Reference Architecture</text>
  <text x="40" y="68" class="s">Embedded chat assistant with CRM tools · RBAC enforced at the tool layer · tamper-evident audit of every request, tool call and response</text>

  <!-- 1 Channels -->
  <rect x="40" y="124" width="250" height="78" class="box" fill="#ecfeff" stroke="#0e7490"/>
  <text x="56" y="150" class="t">Retail website</text>
  <text x="56" y="170" class="s">Storefront + floating chat widget</text>
  <text x="56" y="188" class="x">rich cards · quick replies · 👍/👎</text>
  <rect x="310" y="124" width="250" height="78" class="box" fill="#ecfeff" stroke="#0e7490"/>
  <text x="326" y="150" class="t">Agent desktop</text>
  <text x="326" y="170" class="s">Support agents use same chat</text>
  <text x="326" y="188" class="x">customer 360 · tickets · goodwill</text>
  <rect x="580" y="124" width="250" height="78" class="box" fill="#ecfeff" stroke="#0e7490"/>
  <text x="596" y="150" class="t">Audit &amp; governance console</text>
  <text x="596" y="170" class="s">Auditors / admins</text>
  <text x="596" y="188" class="x">trail · response trace · chain verify</text>

  <!-- 2 Gateway -->
  <rect x="40" y="244" width="790" height="78" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="56" y="270" class="t">API Gateway (Express)</text>
  <text x="56" y="290" class="s">AuthN: signed bearer token (demo) → OIDC/JWT in prod · security headers · body-size limits · per-user rate limiting</text>
  <text x="56" y="308" class="x">/api/chat · /api/chat/feedback · /api/products · /api/audit* · /api/rbac · /api/health</text>

  <!-- Identity (right) -->
  <rect x="870" y="124" width="370" height="198" class="box" fill="#eef2ff" stroke="#4338ca"/>
  <text x="886" y="150" class="t">Identity &amp; Access</text>
  <text x="886" y="172" class="s">IdP (Okta / Entra ID / Cognito) issues JWT</text>
  <text x="886" y="190" class="s">Claims: sub, role, customerId</text>
  <text x="886" y="214" class="t" font-size="13">Roles</text>
  <text x="886" y="234" class="s">customer — own data only (:self scope)</text>
  <text x="886" y="252" class="s">support_agent — any customer, PII masked,</text>
  <text x="886" y="268" class="s">   goodwill ≤ 500 pts</text>
  <text x="886" y="286" class="s">auditor — audit read/verify only</text>
  <text x="886" y="304" class="s">admin — all incl. unmasked PII</text>

  <!-- 3 Orchestration -->
  <rect x="40" y="364" width="790" height="140" class="box" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="56" y="388" class="t">Conversation Orchestrator</text>
  <rect x="56" y="400" width="180" height="92" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="68" y="420" class="t" font-size="13">Guardrails</text>
  <text x="68" y="438" class="x">prompt-injection check</text>
  <text x="68" y="453" class="x">PII / card redaction</text>
  <text x="68" y="468" class="x">length &amp; rate limits</text>
  <text x="68" y="483" class="x">safe refusal</text>
  <rect x="250" y="400" width="250" height="92" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="262" y="420" class="t" font-size="13">Reasoning engine (pluggable)</text>
  <text x="262" y="438" class="x">A) Claude LLM w/ tool use (if API key)</text>
  <text x="262" y="453" class="x">B) Rule NLU: intent + entity extraction</text>
  <text x="262" y="468" class="x">auto-fallback B when A unavailable</text>
  <text x="262" y="483" class="x">LLM sees redacted text only</text>
  <rect x="514" y="400" width="150" height="92" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="526" y="420" class="t" font-size="13">Session memory</text>
  <text x="526" y="438" class="x">last order / product /</text>
  <text x="526" y="453" class="x">customer → "track it"</text>
  <text x="526" y="468" class="x">20-turn window</text>
  <rect x="678" y="400" width="138" height="92" rx="8" fill="#fff" stroke="#14b8a6"/>
  <text x="690" y="420" class="t" font-size="13">Response</text>
  <text x="690" y="438" class="x">text + UI cards</text>
  <text x="690" y="453" class="x">suggestions</text>
  <text x="690" y="468" class="x">responseId (audit)</text>

  <!-- 4 Tool layer -->
  <rect x="40" y="544" width="790" height="78" class="box" fill="#fffbeb" stroke="#b45309"/>
  <text x="56" y="568" class="t">Tool registry + RBAC Policy Enforcement Point</text>
  <text x="56" y="588" class="s">authorize(principal, resource, action, ownerCustomerId) runs inside every tool → allow / deny (+ limits)</text>
  <text x="56" y="608" class="x">search_products · get_order_history · track_order · cancel_order · create_return · get_price_history · get_recommendations · get_customer_profile · …</text>

  <!-- 5 Domain services -->
  <g>
    <rect x="40" y="664" width="122" height="84" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="52" y="688" class="t" font-size="13">Catalog / PIM</text><text x="52" y="706" class="x">36 SKUs: household,</text><text x="52" y="721" class="x">grocery, kids</text><text x="52" y="736" class="x">playsets</text>
    <rect x="173" y="664" width="122" height="84" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="185" y="688" class="t" font-size="13">Orders (OMS)</text><text x="185" y="706" class="x">history, cancel,</text><text x="185" y="721" class="x">returns / RMA</text>
    <rect x="306" y="664" width="122" height="84" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="318" y="688" class="t" font-size="13">Shipping</text><text x="318" y="706" class="x">carrier tracking</text><text x="318" y="721" class="x">events, ETA</text>
    <rect x="439" y="664" width="122" height="84" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="451" y="688" class="t" font-size="13">Pricing</text><text x="451" y="706" class="x">90-day history,</text><text x="451" y="721" class="x">stats, alerts</text>
    <rect x="572" y="664" width="122" height="84" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="584" y="688" class="t" font-size="13">Recommender</text><text x="584" y="706" class="x">affinity, history,</text><text x="584" y="721" class="x">prefs, deals, age</text>
    <rect x="705" y="664" width="125" height="84" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="717" y="688" class="t" font-size="13">CRM</text><text x="717" y="706" class="x">360 profile, loyalty,</text><text x="717" y="721" class="x">tickets, wishlist,</text><text x="717" y="736" class="x">segments</text>
  </g>

  <!-- Audit (right) -->
  <rect x="870" y="364" width="370" height="384" class="box" fill="#fff7ed" stroke="#b45309"/>
  <text x="886" y="390" class="t">Audit &amp; Observability</text>
  <text x="886" y="412" class="s">Append-only JSONL, SHA-256 hash chain</text>
  <text x="886" y="430" class="x">hashₙ = SHA256(recordₙ ‖ hashₙ₋₁) → verify() detects edits</text>
  <text x="886" y="456" class="t" font-size="13">Event types</text>
  <text x="886" y="476" class="s">auth · chat_request · tool_call (allow)</text>
  <text x="886" y="494" class="s">access_denied (deny + reason) · guardrail</text>
  <text x="886" y="512" class="s">chat_response (intent, engine, latency)</text>
  <text x="886" y="530" class="s">feedback (👍/👎 per responseId) · admin</text>
  <text x="886" y="556" class="t" font-size="13">Response audit</text>
  <text x="886" y="576" class="s">Every answer carries a responseId; console</text>
  <text x="886" y="594" class="s">replays request → tools → RBAC → answer</text>
  <text x="886" y="612" class="s">→ user rating for that single turn</text>
  <text x="886" y="638" class="t" font-size="13">Privacy</text>
  <text x="886" y="658" class="s">PII redacted before logging/LLM; masked</text>
  <text x="886" y="676" class="s">in UI for non-admin staff</text>
  <text x="886" y="702" class="t" font-size="13">Prod sinks</text>
  <text x="886" y="722" class="s">WORM storage (S3 Object Lock) · SIEM ·</text>
  <text x="886" y="740" class="s">OpenTelemetry traces &amp; metrics</text>

  <!-- arrows: channels -> gateway -->
  <path class="ln" d="M165,202 V242"/>
  <path class="ln" d="M435,202 V242"/>
  <path class="ln" d="M705,202 V242"/>
  <!-- gateway <-> identity -->
  <path class="ln" d="M830,283 H868"/>
  <!-- gateway -> orchestrator -->
  <path class="ln" d="M435,322 V362"/>
  <!-- orchestrator -> tools -->
  <path class="ln" d="M375,504 V542"/>
  <!-- tools -> services -->
  <path class="ln" d="M101,622 V662"/><path class="ln" d="M234,622 V662"/><path class="ln" d="M367,622 V662"/>
  <path class="ln" d="M500,622 V662"/><path class="ln" d="M633,622 V662"/><path class="ln" d="M767,622 V662"/>
  <!-- audit flows -->
  <path class="au" d="M830,434 H868"/>
  <path class="au" d="M830,583 H868"/>
  <path class="au" d="M830,300 Q850,330 868,380"/>
  <text x="836" y="426" class="x" fill="#b45309">log</text>
  <text x="836" y="575" class="x" fill="#b45309">log</text>

  <!-- Legend -->
  <line x1="40" y1="800" x2="80" y2="800" class="ln"/><text x="88" y="804" class="s">request / data flow</text>
  <line x1="240" y1="800" x2="280" y2="800" class="au"/><text x="288" y="804" class="s">audit event</text>
  <text x="420" y="804" class="s">Demo stack: Node.js + Express · vanilla JS UI · in-memory mock data · optional Claude (Anthropic SDK)</text>
  <text x="40" y="836" class="x">Key principle: the model (or rule engine) only chooses WHICH tool to call — the tool decides WHETHER the signed-in principal may see/do it. The LLM can never exceed user permissions.</text>
  <!-- Layer labels -->
  <text x="40" y="112" class="h">1 · CHANNELS</text>
  <text x="40" y="232" class="h">2 · EDGE / API GATEWAY</text>
  <text x="40" y="352" class="h">3 · ASSISTANT ORCHESTRATION</text>
  <text x="40" y="532" class="h">4 · TOOL LAYER (POLICY ENFORCEMENT)</text>
  <text x="40" y="652" class="h">5 · DOMAIN SERVICES (mock data in demo)</text>

</svg>
